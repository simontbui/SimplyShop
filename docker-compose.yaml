services:
  pgdatabase:
    image: postgres:13
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=SimplyShop
    volumes:
      - "./Database/scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql"
      - "pgdata:/var/lib/postgresql/data:rw"
    ports:
      - "5432:5432"
  pgadmin:
    image: dpage/pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=root
      - PGADMIN_LISTEN_PORT=8080
    ports:
      - "8080:8080"
    # Connect pgadmin to psql via 172.21.0.3 not localhost
    # Check IP address via `docker inspect simplyshop-pgdatabase-1`

  simply-shop-ui:
    build:
      context: ./simply-shop-ui
      dockerfile: ../Dockerfile.ui
    container_name: simply-shop-ui
    working_dir: /app
    command: ["npm", "start"]
    volumes:
      - ./simply-shop-ui:/app
      - /app/node_modules               # ← Prevent host from overwriting node_modules
    ports:
      - "3000:3000"
    depends_on:
      - simply-shop-api
    environment:
      - WATCHPACK_POLLING=true       # ← Required for file watching on Docker Desktop (Windows/Mac)

  simply-shop-api:
    environment:
      - ASPNETCORE_HTTP_PORTS=7073
      - ASPNETCORE_ENVIRONMENT=Development
    build: 
      context: ./SimplyShopAPI
      dockerfile: Dockerfile
    container_name: SimplyShopAPI
    ports:
      - "7073:80"
    depends_on:
      - pgdatabase
  
volumes:
  pgdata: