services:
  pgdatabase:
    image: postgis/postgis:13-3.5-alpine
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=SimplyShop
    volumes:
      #- "./Database/scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql"
      - "pgdata:/var/lib/postgresql/data:rw"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d SimplyShop"]
      interval: 5s
      timeout: 3s
      retries: 20
  pgadmin:
    image: dpage/pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=root
      - PGADMIN_LISTEN_PORT=8080
    ports:
      - "8080:8080"
    # Connect pgadmin to psql via 172.21.0.3 not localhost
    # Check IP address via `docker inspect simplyshop-pgdatabase-1`

  simply-shop-ui:
    build:
      context: ./simply-shop-ui
      dockerfile: ../Dockerfile.ui
    container_name: simply-shop-ui
    working_dir: /app
    command: ["npm", "start"]
    volumes:
      - ./simply-shop-ui:/app
      - /app/node_modules               # ← Prevent host from overwriting node_modules
    ports:
      - "3000:3000"
    depends_on:
      - simply-shop-api
    environment:
      - WATCHPACK_POLLING=true       # ← Required for file watching on Docker Desktop (Windows/Mac)

  simply-shop-api:
    build:
      context: ./SimplyShopAPI
      dockerfile: Dockerfile
    ports:
      - "7073:7073"
    volumes:
      - ./SimplyShopAPI:/app
    working_dir: /app
    command: ["dotnet", "watch", "run", "--project", "SimplyShopAPI.Api/SimplyShopAPI.Api.csproj", "--urls=http://0.0.0.0:7073"]
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      #- pgdatabase
      migrator:
        condition: service_completed_successfully

  migrator:
    build:
      context: ./SimplyShopAPI
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./SimplyShopAPI:/app
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    depends_on:
      pgdatabase:
        condition: service_healthy
    # Run migrations for BOTH contexts, then seed (see section 2)
    command: >
      bash -lc "
        set -e
        dotnet tool restore
        dotnet tool run dotnet-ef database update --project SimplyShopAPI.Infrastructure --startup-project SimplyShopAPI.Api --context SimplyShopContext
        dotnet tool run dotnet-ef database update --project SimplyShopAPI.Infrastructure --startup-project SimplyShopAPI.Api --context AppIdentityDbContext
        dotnet run --project SimplyShopAPI.Api --seed
      "
    restart: "no"
  
volumes:
  pgdata: